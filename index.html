<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <h1 class="shop-name" id="shop-name">Shop Name</h1>
    <p class="shop-tagline" id="shop-tagline">Tagline goes here.</p>
  </header>

  <!-- PROMO VIDEO
       Replace YOUR_VIDEO_ID below with your own YouTube video ID.
       Example: if your video URL is https://youtube.com/watch?v=AbC123xyz
       then YOUR_VIDEO_ID is AbC123xyz
       Delete this whole <section> block if you don't want a video. -->
  <section class="promo-video">
    <div class="promo-video-frame">
      <iframe
        src="videos/WhatsApp Video 2026-09-01 at 09.18.30.mp4"
        title="Shop promo video"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <nav class="filter-bar" id="filter-bar" aria-label="Filter by category"></nav>

  <main class="catalogue" id="catalogue" aria-live="polite"></main>

  <footer class="site-footer">
    Tap "Chat to buy" on any item to message us directly on WhatsApp.
  </footer>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
